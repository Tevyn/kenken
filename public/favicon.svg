<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="KenKen">
  <!-- A rounded tile so the mark stays legible against any browser chrome. -->
  <rect width="24" height="24" rx="5" fill="#1d1b24"/>
  <!-- The Hard difficulty tile (src/ui/icons.tsx DifficultyIcon): a 4x4 grid
       carrying one L-shaped cage. Baked to concrete colours here, since a
       favicon has no currentColor to inherit; the accent is the app's light
       blue, which reads on the dark tile in either theme. -->
  <g stroke="#8ab4f0">
    <!-- Faint gridlines, the divider hairline the board draws. -->
    <g stroke-width="0.75" opacity="0.5">
      <path d="M7.5 3V21M12 3V21M16.5 3V21M3 7.5H21M3 12H21M3 16.5H21"/>
    </g>
    <!-- The cage: tinted fill plus a heavier outline. -->
    <path d="M7.5 7.5H16.5V12H12V16.5H7.5Z" fill="#8ab4f0" fill-opacity="0.38"
          stroke-width="1.8" stroke-linejoin="miter"/>
    <!-- The frame, the strongest line, drawn last. -->
    <rect x="3" y="3" width="18" height="18" fill="none" stroke-width="2" stroke-linejoin="miter"/>
  </g>
</svg>
